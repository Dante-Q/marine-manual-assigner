<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Marina Manual Assigner</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <header class="topbar">
    <div>
      <h1>Marina Manual Assigner</h1>
      <p>Browse and inspect marina source records</p>
    </div>
  </header>

  <main class="app">

    <aside class="sidebar">

      <section>
        <h2>Data Sources</h2>

        <button class="source-button active" data-source="tyha">
          <span>TYHA</span>
          <span class="count" id="count-tyha">0</span>
        </button>

        <button class="source-button" data-source="marinas-com">
          <span>Marinas.com</span>
          <span class="count" id="count-marinas-com">0</span>
        </button>

        <button class="source-button" data-source="osm">
          <span>OSM</span>
          <span class="count" id="count-osm">0</span>
        </button>

      </section>

    </aside>

    <section class="records-panel">

      <div class="records-header">
        <div>
          <h2 id="source-title">TYHA Records</h2>
          <span id="record-count">0 records</span>
        </div>

        <input
          type="search"
          id="search"
          placeholder="Search records..."
        >
      </div>

      <div class="content">

        <div class="record-list" id="record-list">
          <div class="loading">
            Loading records...
          </div>
        </div>

        <div class="record-detail" id="record-detail">
          <div class="empty-state">
            <h2>Select a record</h2>
            <p>
              Select a marina from the list to view its details.
            </p>
          </div>
        </div>

      </div>

    </section>

  </main>

  <script type="module" src="/app.js"></script>

</body>
</html>
